name: post-video

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          fc-list | grep -qi amiri || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-hosny-amiri; }

      - name: Install python packages
        run: pip install -r requirements.txt

      - name: Make and upload video
        run: python main.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save used words
        if: success()
        run: |
          git config user.name "kalima-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used.json
          git commit -m "used word" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} && git push && exit 0
            sleep 5
          done
          exit 1
